<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Écosystème</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #app { width: 100%; height: 100%; display: block; }
      #overlay {
        position: fixed; top: 8px; left: 8px; padding: 8px 10px;
        font: 12px/1.5 monospace; color: #e8f5e9;
        background: rgba(10, 25, 20, 0.65); border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
      #inspector {
        position: fixed; bottom: 8px; left: 8px; padding: 8px 10px;
        font: 12px/1.5 monospace; color: #fff3e0;
        background: rgba(25, 15, 10, 0.7); border-radius: 6px;
        pointer-events: none; white-space: pre;
      }
      #popgraph {
        position: fixed; bottom: 8px; right: 8px;
        background: rgba(10, 25, 20, 0.65); border-radius: 6px;
        pointer-events: none;
      }
      #timebar {
        position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 4px; padding: 6px 8px;
        background: rgba(10, 25, 20, 0.7); border-radius: 8px;
        font: 12px/1 monospace;
      }
      #tools {
        position: fixed; top: 8px; right: 8px;
        display: flex; flex-direction: column; gap: 4px; padding: 6px 8px;
        background: rgba(10, 25, 20, 0.7); border-radius: 8px;
        font: 12px/1 monospace;
      }
      #timebar button, #tools button {
        font: 12px/1 monospace; color: #e8f5e9; cursor: pointer;
        background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 5px; padding: 5px 8px;
      }
      #timebar button:hover, #tools button:hover { background: rgba(255, 255, 255, 0.18); }
      #timebar button.active, #tools button.active {
        background: #aed581; color: #1a2a12; border-color: #aed581; font-weight: bold;
      }
      #tools .sep { height: 1px; background: rgba(255,255,255,0.15); margin: 2px 0; }

      /* --- Phase 6 : HUD de survie --- */
      #hud {
        position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
        display: none; flex-direction: column; gap: 3px; width: 300px;
        font: 11px/1.4 monospace; color: #fff; text-shadow: 0 1px 2px #000a;
        pointer-events: none;
      }
      #hud.on { display: flex; }
      #hud .bar {
        height: 9px; background: rgba(0, 0, 0, 0.45); border-radius: 5px;
        overflow: hidden;
      }
      #hud .bar > i { display: block; height: 100%; width: 0; }
      #hud .danger {
        text-align: center; color: #ff6b5e; font-weight: bold; min-height: 15px;
      }
      #hud .hint { text-align: center; opacity: 0.75; }
      #death {
        position: fixed; inset: 0; display: none; place-items: center;
        background: rgba(0, 0, 0, 0.72); color: #fff; z-index: 10;
        font: 14px/1.7 monospace; text-align: center;
      }
      #death.on { display: grid; }
      #death .title { font-size: 26px; margin-bottom: 8px; }
      #death button {
        margin-top: 16px; padding: 9px 20px; font: 13px/1 monospace; cursor: pointer;
        background: #aed581; border: 0; border-radius: 6px; color: #1a2a12;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="overlay"></div>
    <div id="inspector"></div>
    <canvas id="popgraph" width="260" height="84"></canvas>
    <div id="timebar"></div>
    <div id="tools"></div>
    <div id="hud"></div>
    <div id="death"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
